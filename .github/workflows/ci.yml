name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t odesa-power-lift:test .
      - name: Check SQLite volume and healthcheck inside the image
        run: |
          docker run --rm --read-only --tmpfs /tmp -v smoke_data:/app/data odesa-power-lift:test python -c "from pathlib import Path; from datetime import datetime, UTC; from database import Database; from healthcheck import healthy; p=Path('/app/data/smoke.sqlite3'); d=Database(p); now=datetime.now(UTC); [d.set_meta(k, now.isoformat()) for k in ('heartbeat_monitor','heartbeat_scheduler','heartbeat_polling')]; assert healthy(p, now); d.close()"
