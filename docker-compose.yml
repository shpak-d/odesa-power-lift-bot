name: odesa-power-lift
services:
  bot:
    build: .
    container_name: odesa-power-lift-bot
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
      TZ: Europe/Kyiv
      APP_MODE: ${APP_MODE:-web}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - bot_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  telegram:
    build: .
    container_name: odesa-power-lift-telegram
    profiles: [telegram]
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
      TZ: Europe/Kyiv
      APP_MODE: telegram
    volumes:
      - telegram_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bot_data:
  telegram_data:
